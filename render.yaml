services:
  - type: web
    name: systemrpg
    env: java
    plan: free
    buildCommand: cd zero && mvn clean package -DskipTests
    startCommand: cd zero && java -jar target/*.jar
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000